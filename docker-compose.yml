version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: secops-vault-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - secops_vault_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: secops_vault
    networks:
      - secops-net

  redis:
    image: redis:7.0-alpine
    container_name: secops-vault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - secops_vault_redis_data:/data
    networks:
      - secops-net

  secops-vault-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secops-vault-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/secops_vault
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      - mongodb
      - redis
    networks:
      - secops-net

volumes:
  secops_vault_mongo_data:
  secops_vault_redis_data:

networks:
  secops-net:
    driver: bridge
